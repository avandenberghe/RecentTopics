services:
    avathar.recenttopics.controller.page_controller:
        class: avathar\recenttopics\controller\page_controller
        arguments:
            - '@config'
            - '@controller.helper'
            - '@language'
            - '@avathar.recenttopics.functions'

    avathar.recenttopics.functions:
        class: avathar\recenttopics\core\recenttopics
        arguments:
            - '@auth'
            - '@cache'
            - '@config'
            - '@language'
            - '@content.visibility'
            - '@dbal.conn'
            - '@dispatcher'
            - '@pagination'
            - '@request'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '@?part3.topicprefixes.functions'
            - '@?prefixed.manager'
            - '@?phpbb.collapsiblecategories.operator'
    avathar.recenttopics.listener:
        class: avathar\recenttopics\event\listener
        arguments:
            - '@avathar.recenttopics.functions'
            - '@config'
            - '@request'
        tags:
            - { name: event.listener }
    avathar.recenttopics.ucp_listener:
        class: avathar\recenttopics\event\ucp_listener
        arguments:
            - '@auth'
            - '@config'
            - '@request'
            - '@template'
            - '@user'
            - '@language'
            - '@dbal.conn'
        tags:
            - { name: event.listener }
